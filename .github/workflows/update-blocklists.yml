name: Update Pi-hole Blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create list directory
        run: mkdir -p lists

      - name: Download upstream blocklists
        shell: bash
        run: |
          set -euo pipefail

          download() {
            url="$1"
            dest="$2"
            tmp="${dest}.tmp"

            curl -fL --retry 3 --retry-delay 3 "$url" -o "$tmp"

            if [ ! -s "$tmp" ]; then
              echo "Downloaded file is empty: $url"
              exit 1
            fi

            mv "$tmp" "$dest"
          }

          download "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt" "lists/pro.txt"
          download "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/tif.medium.txt" "lists/tif-medium.txt"
          download "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/nsfw.txt" "lists/nsfw.txt"
          download "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/gambling.medium.txt" "lists/gambling-medium.txt"
          download "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/social.txt" "lists/social.txt"
          download "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/nosafesearch.txt" "lists/nosafesearch.txt"
          download "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/doh-vpn-proxy-bypass.txt" "lists/doh-vpn-proxy-bypass.txt"
          download "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts" "lists/stevenblack-hosts.txt"

      - name: Commit updated mirrors
        shell: bash
        run: |
          git config user.name "MikeTechSecurity Blocklist Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lists/pro.txt \
                  lists/tif-medium.txt \
                  lists/nsfw.txt \
                  lists/gambling-medium.txt \
                  lists/social.txt \
                  lists/nosafesearch.txt \
                  lists/doh-vpn-proxy-bypass.txt \
                  lists/stevenblack-hosts.txt

          if git diff --cached --quiet; then
            echo "No upstream changes detected."
            exit 0
          fi

          git commit -m "Update mirrored Pi-hole blocklists"
          git push
